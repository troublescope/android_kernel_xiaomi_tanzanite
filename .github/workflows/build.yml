name: tanzanite kernel build

on:
  push:
    branches:
      - main
      - fix/boot
      - 'fix/**'
    paths:
      - 'arch/**'
      - 'drivers/**'
      - 'sound/**'
      - 'kernel/**'
      - 'mm/**'
      - 'net/**'
      - 'fs/**'
      - 'crypto/**'
      - 'block/**'
      - 'init/**'
      - 'ipc/**'
      - 'lib/**'
      - 'security/**'
      - 'scripts/**'
      - 'tools/**'
      - 'include/**'
      - 'usr/**'
      - 'virt/**'
      - 'Makefile'
      - 'Kbuild'
      - 'Kconfig'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout and build'
        required: true
        default: 'fix/boot'
      defconfig:
        description: 'Defconfig name'
        required: true
        default: 'tanzanite_defconfig'

jobs:
  build:
    name: Build Tanzanite Kernel (${{ github.event.inputs.branch || github.ref_name }})
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            python3-pip cpio lz4 git ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Fetch Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Configure kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          DEFCONFIG="${{ github.event.inputs.defconfig || 'tanzanite_defconfig' }}"
          echo "Using defconfig: $DEFCONFIG"
          make "$DEFCONFIG"

      - name: Build Image, Image.gz and modules
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          set -o pipefail
          make -j$(nproc) Image Image.gz modules 2>&1 | tee build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          cp -v arch/arm64/boot/Image out/ 2>/dev/null || true
          cp -v arch/arm64/boot/Image.gz out/ 2>/dev/null || true
          find . -name '*.ko' | head -n 50 | xargs -r cp -t out/ 2>/dev/null || true
          cp -v build.log out/ 2>/dev/null || true
          cp -v .config out/tanzanite_built.config 2>/dev/null || true
          ls -lh out/
          REF_RAW="${{ github.event.inputs.branch || github.ref_name }}"
          SAFE_REF=$(echo "$REF_RAW" | tr '/' '-' | tr ' ' '-')
          echo "ARTIFACT_NAME=tanzanite-build-${SAFE_REF}" >> $GITHUB_ENV

      - name: Generate build summary
        if: always()
        run: |
          echo "### Tanzanite Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref / Branch**: \`${{ github.event.inputs.branch || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f "out/Image" ]; then
            echo "- **Image Size**: \`$(ls -lh out/Image | awk '{print $5}')\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Image**: ❌ Not built" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "out/Image.gz" ]; then
            echo "- **Image.gz Size**: \`$(ls -lh out/Image.gz | awk '{print $5}')\`" >> $GITHUB_STEP_SUMMARY
          fi
          MODULE_COUNT=$(find out/ -name '*.ko' | wc -l)
          echo "- **Modules Collected**: \`$MODULE_COUNT\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME || 'tanzanite-build' }}
          path: out/
          retention-days: 7

